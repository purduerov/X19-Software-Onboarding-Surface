# ROV X-19 Surface Multi-Node Orchestration Configuration
session_name: rov_x19

# Default mode: dev (includes tailwind watcher) | field (runs pre-compiled CSS, skips watcher)
default_mode: dev

# Node definitions
nodes:
  - name: "Flask Backend"
    cwd: "src/frontend/src"
    cmd: "../../../venv/bin/python app.py"
    mode: "all"  # Runs in both dev and field modes

  - name: "Tailwind CSS Watcher"
    cwd: "src/frontend"
    cmd: "npm run dev:css"
    mode: "dev"  # Only runs in dev mode

  - name: "ZMQ Go2RTC Video Node"
    cwd: "."
    cmd: "./venv/bin/python src/zmq/python/videos/go2rtc_node.py"
    mode: "all"

  # - name: "Depth Camera Node"
  #   cwd: "."
  #   cmd: "./venv/bin/python src/zmq/python/messaging/depth_camera_node.py"
  #   mode: "all"

  - name: "Onboard Node"
    cwd: "."
    cmd: "./venv/bin/python src/zmq/python/messaging/depth_subscriber_node.py"
    mode: "all"

  


